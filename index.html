<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cosmic Atlas is a 2D Solar System navigation prototype using live NASA/JPL ephemeris data."
    />
    <meta name="theme-color" content="#0b0f12" />
    <meta property="og:title" content="Cosmic Atlas" />
    <meta
      property="og:description"
      content="A scientifically grounded 2D Solar System map and spacecraft navigation prototype."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cosmic Atlas</title>
  </head>
  <body>
    <a class="skip-link" href="#controls">Skip to controls</a>
    <main id="app">
      <canvas id="map" aria-label="2D heliocentric ecliptic Solar System map"></canvas>

      <aside class="panel hud status-panel" aria-label="Simulation HUD">
        <div class="title-row">
          <div>
            <p class="eyebrow">Live heliocentric atlas</p>
            <h1>Cosmic Atlas</h1>
          </div>
          <span id="load-state">loading</span>
        </div>
        <dl id="hud-values"></dl>
      </aside>

      <section class="panel controls mission-panel" id="controls" aria-label="Destination controls">
        <div class="panel-head">
          <p class="eyebrow">Destination</p>
          <h2>Where do you want to go?</h2>
        </div>
        <div class="destination-row">
          <label for="destination-search">Search loaded bodies</label>
          <input id="destination-search" type="search" list="body-options" autocomplete="off" placeholder="Search loaded body" />
          <datalist id="body-options"></datalist>
          <button id="set-destination" type="button">Target</button>
          <button id="jump-destination" type="button">Jump</button>
        </div>

        <div class="quick-targets">
          <span>Quick targets</span>
          <div class="target-row" id="target-buttons"></div>
        </div>

        <div class="body-row">
          <label for="body-select">Inspect body</label>
          <select id="body-select" aria-label="Selected body"></select>
          <button id="target-selected" type="button" title="Set selected body as target">Target</button>
          <button id="center-selected" type="button" title="Center on selected body">Center</button>
        </div>

        <div class="time-controls" aria-label="Time controls">
          <label for="time-input">UTC</label>
          <input id="time-input" type="datetime-local" step="1" />
          <button id="apply-time" type="button">Apply</button>
          <div class="time-step-row">
            <button type="button" data-step-days="-30">−30d</button>
            <button type="button" data-step-days="-7">−7d</button>
            <button type="button" data-step-days="-1">−1d</button>
            <button id="time-now" type="button">Now</button>
            <button type="button" data-step-days="1">+1d</button>
            <button type="button" data-step-days="7">+7d</button>
            <button type="button" data-step-days="30">+30d</button>
          </div>
        </div>
        <div class="zoom-row">
          <button id="zoom-out" type="button" title="Zoom out">−</button>
          <button id="zoom-in" type="button" title="Zoom in">+</button>
          <button id="center-sun" type="button" title="Center on Sun">Sun</button>
          <button id="center-ship" type="button" title="Center on ship">Ship</button>
        </div>
      </section>

      <aside class="panel journey-panel" aria-label="Journey panel">
        <div class="reset-row">
          <button id="reset-ship" type="button">Reset ship near Earth</button>
          <button id="restart-journey" type="button">Restart journey</button>
        </div>
        <div id="journey"></div>
        <div id="body-info"></div>
      </aside>

      <section class="panel flight-deck" aria-label="Flight controls">
        <div class="flight-copy">
          <p class="eyebrow">Flight deck</p>
          <strong>W/S thrust · A/D rotate · Space warp</strong>
        </div>
        <div id="flight-values"></div>
      </section>

      <div class="scale-note">Visual radii exaggerated. AU rings are distance guides.</div>
      <div class="error-panel" id="error-panel" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cosmic Atlas is a 2D Solar System navigation prototype using live NASA/JPL ephemeris data."
    />
    <meta name="theme-color" content="#0b0f12" />
    <meta property="og:title" content="Cosmic Atlas" />
    <meta
      property="og:description"
      content="A scientifically grounded 2D Solar System map and spacecraft navigation prototype."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cosmic Atlas</title>
  </head>
  <body>
    <a class="skip-link" href="#controls">Skip to controls</a>
    <main id="app">
      <canvas id="map" aria-label="2D heliocentric ecliptic Solar System map"></canvas>

      <aside class="panel hud status-panel" aria-label="Simulation HUD">
        <div class="title-row">
          <div>
            <p class="eyebrow">Live heliocentric atlas</p>
            <h1>Cosmic Atlas</h1>
          </div>
          <span id="load-state">loading</span>
        </div>
        <dl id="hud-values"></dl>
      </aside>

      <section class="panel controls mission-panel" id="controls" aria-label="Destination controls">
        <div class="panel-head">
          <p class="eyebrow">Destination</p>
          <h2>Plot a route</h2>
        </div>
        <div class="destination-card">
          <label for="destination-search">Destination body</label>
          <div class="search-control">
            <input id="destination-search" type="search" list="body-options" autocomplete="off" placeholder="Search loaded body" />
            <datalist id="body-options"></datalist>
            <button id="set-destination" class="primary-action" type="button" aria-label="Set destination as target">Target</button>
            <button id="jump-destination" class="icon-button" type="button" title="Center on destination" aria-label="Center on destination">Center</button>
          </div>
        </div>

        <div class="quick-targets">
          <span>Frequent routes</span>
          <div class="target-row" id="target-buttons"></div>
        </div>

        <div class="body-row inspect-card">
          <label for="body-select">Inspect body</label>
          <select id="body-select" aria-label="Selected body"></select>
          <div class="icon-cluster">
            <button id="target-selected" class="icon-button" type="button" title="Set selected body as target" aria-label="Set selected body as target">Target</button>
            <button id="center-selected" class="icon-button" type="button" title="Center on selected body" aria-label="Center on selected body">Center</button>
          </div>
        </div>

        <div class="time-controls" aria-label="Time controls">
          <div class="time-header">
            <label for="time-input">UTC timestamp</label>
            <button id="time-now" class="text-action" type="button">Now</button>
          </div>
          <div class="time-input-row">
            <input id="time-input" type="datetime-local" step="1" />
            <button id="apply-time" class="icon-button" type="button" title="Apply timestamp" aria-label="Apply timestamp">Apply</button>
          </div>
          <div class="time-step-row">
            <button type="button" data-step-days="-30" aria-label="Move timestamp back 30 days">30d</button>
            <button type="button" data-step-days="-7" aria-label="Move timestamp back 7 days">7d</button>
            <button type="button" data-step-days="-1" aria-label="Move timestamp back 1 day">1d</button>
            <button type="button" data-step-days="1" aria-label="Move timestamp forward 1 day">1d</button>
            <button type="button" data-step-days="7" aria-label="Move timestamp forward 7 days">7d</button>
            <button type="button" data-step-days="30" aria-label="Move timestamp forward 30 days">30d</button>
          </div>
        </div>
      </section>

      <section class="panel map-tools" aria-label="Map tools">
        <span>Map tools</span>
        <div class="icon-cluster">
          <button id="zoom-out" class="icon-button" type="button" title="Zoom out" aria-label="Zoom out">−</button>
          <button id="zoom-in" class="icon-button" type="button" title="Zoom in" aria-label="Zoom in">+</button>
          <button id="center-sun" class="icon-button" type="button" title="Center on Sun" aria-label="Center on Sun">Sun</button>
          <button id="center-ship" class="icon-button" type="button" title="Center on ship" aria-label="Center on ship">Ship</button>
        </div>
      </section>

      <aside class="panel journey-panel" aria-label="Journey panel">
        <div class="reset-row">
          <span>Ship controls</span>
          <div class="icon-cluster">
            <button id="reset-ship" class="icon-button" type="button" title="Reset ship near Earth" aria-label="Reset ship near Earth">Reset ship</button>
            <button id="restart-journey" class="icon-button" type="button" title="Restart journey" aria-label="Restart journey">Restart</button>
          </div>
        </div>
        <div id="journey"></div>
        <div id="body-info"></div>
      </aside>

      <section class="panel flight-deck" aria-label="Flight controls">
        <div class="flight-copy">
          <p class="eyebrow">Flight deck</p>
          <strong>W/S thrust · A/D rotate · Space warp</strong>
        </div>
        <div id="flight-values"></div>
      </section>

      <div class="scale-note">Visual radii exaggerated. AU rings are distance guides.</div>
      <div class="error-panel" id="error-panel" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

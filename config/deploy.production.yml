service: skychart-production

accessories:
  postgres:
    image: postgres:16-alpine
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    env:
      clear:
        POSTGRES_USER: skychart
        POSTGRES_DB: skychart
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - skychart-production-postgres-data:/var/lib/postgresql/data

env:
  clear:
    PHX_HOST: skychart.org
    PORT: "4000"
    PYTHON_BACKEND_URL: http://127.0.0.1:8765
    TRUSTED_PROXY_CIDRS: '<%= ENV.fetch("TRUSTED_PROXY_CIDRS", "172.16.0.0/12") %>'
    CATALOG_TILE_MANIFEST_URL: '<%= ENV.fetch("CATALOG_TILE_MANIFEST_URL", "") %>'
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
    - SENTRY_DSN
    - ANALYTICS_HASH_SALT
<% if ENV["COMMUNITY_ENABLED"] == "true" %>
    - COMMUNITY_DATABASE_URL
    - COMMUNITY_SECRET
    - COMMUNITY_S3_BUCKET
    - COMMUNITY_S3_ACCESS_KEY_ID
    - COMMUNITY_S3_SECRET_ACCESS_KEY
    - COMMUNITY_MAIL_TOKEN
    - COMMUNITY_BACKUP_SECRET
    - COMMUNITY_BACKUP_ACCESS_KEY_ID
    - COMMUNITY_BACKUP_SECRET_ACCESS_KEY
<% end %>

proxy:
  hosts:
    - skychart.org

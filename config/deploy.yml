service: skychart
retain_containers: 2
image: ferdev/skychart

minimum_version: 2.4.0

deploy_timeout: 600
drain_timeout: 20
readiness_delay: 7

servers:
  web:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>

<% if ENV["COMMUNITY_ENABLED"] == "true" %>
  community_worker:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
    cmd: /app/scripts/community-worker.sh
    proxy: false
    options:
      memory: 1152m
      cpus: 1
      no-healthcheck: true
    env:
      clear:
        COMMUNITY_WORKER: "true"
        SKY_EVENTS_REFRESH_ENABLED: "false"
<% end %>

ssh:
  user: <%= ENV.fetch("DEPLOY_USER") %>

registry:
  server: ghcr.io
  username: ferdev
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  args:
    VITE_SENTRY_DSN: <%= ENV["VITE_SENTRY_DSN"] %>

env:
  clear:
    SKYCHART_APPLICATION_HOST: "1"
    COMMUNITY_ENABLED: '<%= ENV.fetch("COMMUNITY_ENABLED", "false") %>'
<% if ENV["COMMUNITY_ENABLED"] == "true" %>
    COMMUNITY_STORAGE: s3
    COMMUNITY_ORIGIN: '<%= ENV.fetch("COMMUNITY_ORIGIN") %>'
    COMMUNITY_MEDIA_URL: '<%= ENV.fetch("COMMUNITY_MEDIA_URL") %>'
    COMMUNITY_S3_ENDPOINT: '<%= ENV.fetch("COMMUNITY_S3_ENDPOINT") %>'
    COMMUNITY_S3_REGION: '<%= ENV.fetch("COMMUNITY_S3_REGION", "us-east-1") %>'
    COMMUNITY_MAIL_URL: '<%= ENV.fetch("COMMUNITY_MAIL_URL") %>'
    COMMUNITY_BACKUP_URI: '<%= ENV.fetch("COMMUNITY_BACKUP_URI") %>'
    COMMUNITY_BACKUP_ENDPOINT: '<%= ENV.fetch("COMMUNITY_BACKUP_ENDPOINT") %>'
<% end %>
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
    - POSTGRES_PASSWORD
    - SENTRY_DSN
    - ANALYTICS_HASH_SALT
<% if ENV["COMMUNITY_ENABLED"] == "true" %>
    - COMMUNITY_DATABASE_URL
    - COMMUNITY_SECRET
    - COMMUNITY_S3_BUCKET
    - COMMUNITY_S3_ACCESS_KEY_ID
    - COMMUNITY_S3_SECRET_ACCESS_KEY
    - COMMUNITY_MAIL_TOKEN
    - COMMUNITY_BACKUP_SECRET
    - COMMUNITY_BACKUP_ACCESS_KEY_ID
    - COMMUNITY_BACKUP_SECRET_ACCESS_KEY
<% end %>

proxy:
  run:
    bind_ips:
      - 95.216.18.168
      - 2a01:4f9:2a:12c9::2
  app_port: 4000
  ssl: true
  forward_headers: true
  healthcheck:
    path: /api/health
    interval: 3
    timeout: 3

logging:
  driver: json-file
  options:
    max-size: 50m
    max-file: "3"

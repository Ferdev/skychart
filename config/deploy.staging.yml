service: skychart-staging
image: ferdev/skychart-staging

env:
  clear:
    PHX_HOST: staging.skychart.org
    PORT: "4000"
    POOL_SIZE: "2"
    PYTHON_BACKEND_URL: http://127.0.0.1:8765
    TRUSTED_PROXY_CIDRS: '<%= ENV.fetch("TRUSTED_PROXY_CIDRS", "172.16.0.0/12") %>'
    CATALOG_TILE_MANIFEST_URL: '<%= ENV.fetch("CATALOG_TILE_MANIFEST_URL", "") %>'
    ANALYTICS_ENABLED: "false"
    SKY_EVENTS_REFRESH_ENABLED: "false"
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
    - SENTRY_DSN
    - ANALYTICS_HASH_SALT
<% if ENV["COMMUNITY_ENABLED"] == "true" %>
    - COMMUNITY_DATABASE_URL
    - COMMUNITY_SECRET
    - COMMUNITY_S3_BUCKET
    - COMMUNITY_S3_ACCESS_KEY_ID
    - COMMUNITY_S3_SECRET_ACCESS_KEY
    - COMMUNITY_MAIL_TOKEN
    - COMMUNITY_BACKUP_SECRET
    - COMMUNITY_BACKUP_ACCESS_KEY_ID
    - COMMUNITY_BACKUP_SECRET_ACCESS_KEY
<% end %>

proxy:
  hosts:
    - staging.skychart.org

name: Deploy Staging

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: skychart-deploy-host
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      DOCKER_BUILDKIT: 1
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD || github.token }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      ANALYTICS_HASH_SALT: ${{ secrets.ANALYTICS_HASH_SALT }}
      CATALOG_TILE_MANIFEST_URL: ${{ vars.STAGING_CATALOG_TILE_MANIFEST_URL }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      MINIMUM_DEPLOY_FREE_GIB: "6"

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@6e5d382445ae5590b7449d8b3bc8cb1c2c27f617 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Kamal
        run: gem install kamal -v "2.10.1"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          {
            printf 'Host %s\n' "$DEPLOY_HOST"
            printf '  User %s\n' "$DEPLOY_USER"
            printf '  IdentityFile ~/.ssh/deploy_key\n'
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  UserKnownHostsFile ~/.ssh/known_hosts\n'
            printf '  LogLevel ERROR\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ferdev
          password: ${{ env.KAMAL_REGISTRY_PASSWORD }}

      - name: Verify required secrets
        shell: bash
        run: |
          missing=()
          for v in KAMAL_REGISTRY_PASSWORD SECRET_KEY_BASE DATABASE_URL SENTRY_DSN ANALYTICS_HASH_SALT DEPLOY_HOST DEPLOY_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing or empty secrets: ${missing[*]}"
            exit 1
          fi

      - name: Write Kamal secrets
        shell: bash
        run: |
          mkdir -p .kamal
          umask 077
          cat > .kamal/secrets.staging <<'SECRETS_EOF'
          KAMAL_REGISTRY_PASSWORD=$KAMAL_REGISTRY_PASSWORD
          SECRET_KEY_BASE=$SECRET_KEY_BASE
          DATABASE_URL=$DATABASE_URL
          SENTRY_DSN=$SENTRY_DSN
          ANALYTICS_HASH_SALT=$ANALYTICS_HASH_SALT
          SECRETS_EOF
          sed -i 's/^[[:space:]]*//' .kamal/secrets.staging
          cp .kamal/secrets.staging .kamal/secrets-common

      - name: Release stale deploy lock
        run: kamal lock release -d staging || true

      # `kamal redeploy` intentionally omits pruning. Enforce the shared
      # retain_containers policy before pulling another image and after the
      # replacement is proven healthy.
      - name: Prune superseded staging artifacts
        run: kamal prune all -d staging

      - name: Verify staging host storage headroom
        run: bash scripts/verify_deploy_storage.sh

      - name: Ensure Kamal proxy
        run: kamal proxy boot -d staging || true

      - name: Deploy to staging
        run: kamal redeploy -d staging

      - name: Smoke test staging
        run: curl -fsS https://staging.skychart.org/api/health

      - name: Enforce staging artifact retention
        run: kamal prune all -d staging

name: Deploy Staging

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      DOCKER_BUILDKIT: 1
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD || github.token }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DATABASE_URL: ecto://skychart:${{ secrets.POSTGRES_PASSWORD }}@skychart-staging-postgres/skychart
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Kamal
        run: gem install kamal -v "~> 2.4"

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          ssh-keyscan -H 5.161.73.221 >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'SSHEOF'
          Host 5.161.73.221
            User deploy
            IdentityFile ~/.ssh/hetzner_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          SSHEOF
          sed -i 's/^[[:space:]]*//' ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ferdev
          password: ${{ env.KAMAL_REGISTRY_PASSWORD }}

      - name: Verify required secrets
        shell: bash
        run: |
          missing=()
          for v in KAMAL_REGISTRY_PASSWORD SECRET_KEY_BASE POSTGRES_PASSWORD DATABASE_URL SENTRY_DSN; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then missing+=("SSH_PRIVATE_KEY"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing or empty secrets: ${missing[*]}"
            exit 1
          fi

      - name: Write Kamal secrets
        shell: bash
        run: |
          mkdir -p .kamal
          umask 077
          cat > .kamal/secrets.staging <<'SECRETS_EOF'
          KAMAL_REGISTRY_PASSWORD=$KAMAL_REGISTRY_PASSWORD
          SECRET_KEY_BASE=$SECRET_KEY_BASE
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          DATABASE_URL=$DATABASE_URL
          SENTRY_DSN=$SENTRY_DSN
          SECRETS_EOF
          sed -i 's/^[[:space:]]*//' .kamal/secrets.staging
          cp .kamal/secrets.staging .kamal/secrets-common
          cat .kamal/secrets.staging

      - name: Release stale deploy lock
        run: kamal lock release -d staging || true

      - name: Boot Postgres accessory
        run: kamal accessory boot postgres -d staging || true

      - name: Deploy to staging
        run: kamal deploy -d staging

      - name: Smoke test staging
        run: curl -fsS https://staging.skychart.org/api/health

name: CI

on:
  pull_request:
    branches:
      - trunk
      - production
  push:
    branches:
      - trunk
      - production

permissions:
  contents: read

env:
  MIX_ENV: test
  PGHOST: 127.0.0.1
  PGUSER: postgres
  PGPASSWORD: postgres

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build frontend for Phoenix
        run: npm run build:phoenix

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            backend_phoenix/deps
            backend_phoenix/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('backend_phoenix/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Phoenix dependencies
        working-directory: backend_phoenix
        run: mix deps.get

      - name: Compile Phoenix
        working-directory: backend_phoenix
        run: mix compile --warnings-as-errors

      - name: Run Phoenix tests
        working-directory: backend_phoenix
        run: mix test
